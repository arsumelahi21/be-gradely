name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate # Prisma client needed before nest build
      - run: npm run lint
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gradely_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Matches test/setup-env.ts + test/global-setup.ts defaults (localhost:5433/gradely_test).
      # global-setup runs `prisma migrate deploy` before the suite — now builds the FULL schema
      # (Phase 3/4 tables) thanks to the committed catch-up migration. JWT/AWS/CORS env come from
      # setup-env.ts defaults, so they don't need to be set here.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/gradely_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:e2e
