name: CI

on:
  push:
    branches: [stagging, main]
  pull_request:
    branches: [stagging, main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate # Prisma client needed before nest build
      - run: npm run lint
      - run: npm run build
      # 197 unit tests that finish in seconds and CI has never run (KNOWN_ISSUES #17).
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    # Generous because a contended runner has taken 4x the usual time; the point is only to
    # stop a pathological run burning the 6-hour default.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gradely_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # The suite pins the cache to Redis db 1 and flushes it between tests.
      # Without one the run hangs: CacheService reconnects forever.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # BASE name only: setup-env.ts appends `_w<jest worker id>`, and global-setup.ts creates
      # and migrates one database per worker (its E2E_WORKERS must match maxWorkers in
      # jest-e2e.json). The `gradely_test` database the service container creates goes unused.
      # JWT/AWS/CORS env come from setup-env.ts defaults, so they don't need to be set here.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/gradely_test?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:e2e
